name: Prototip denetimi
on:
  push:
  pull_request:
jobs:
  simulation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: JavaScript sözdizimini denetle
        run: |
          node --check simulation.js
          node --check app.js
          node --check battle.js
          node --check server.cjs
          node --check launch.cjs
      - name: Sefer kurallarını test et
        run: npm test
